<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="按住 Option，按 Tab 选择，松开 Option 切换到窗口">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132834"/>
      <stop offset="1" stop-color="#070F17"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A3540"/>
      <stop offset="1" stop-color="#1D252D"/>
    </linearGradient>
    <linearGradient id="capOn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E5B58"/>
      <stop offset="1" stop-color="#1D3D3C"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#4DDBBD"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Segoe UI", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .step { font-size: 22px; font-weight: 700; fill: #FFFFFF; }
    .desc { font-size: 16px; fill: #9FB4BD; }
    .num { font-size: 15px; font-weight: 800; fill: #0A2B33; }
    .key { font-weight: 700; fill: #FFFFFF; }
    .hint { font-size: 13px; fill: #9FB4BD; }
  </style>

  <rect width="1200" height="330" rx="24" fill="url(#bg)"/>

  <!-- Step 1: hold Option -->
  <g transform="translate(200 0)">
    <rect x="-70" y="68" width="140" height="120" rx="18" fill="#04080C"/>
    <rect x="-70" y="60" width="140" height="120" rx="18" fill="url(#capOn)" stroke="#4DDBBD" stroke-opacity="0.7" stroke-width="2"/>
    <text x="-48" y="98" font-size="15" class="hint" fill="#BFE9DF">option</text>
    <text x="0" y="152" font-size="52" class="key" text-anchor="middle">⌥</text>
    <path d="M-14 42 V24 M-22 34 L-14 44 L-6 34 M14 42 V24 M6 34 L14 44 L22 34" fill="none" stroke="#4DDBBD" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-118" cy="232" r="14" fill="#4DDBBD"/>
    <text x="-118" y="237" class="num" text-anchor="middle">1</text>
    <text x="-94" y="240" class="step">按住 Option</text>
    <text x="0" y="276" class="desc" text-anchor="middle">保持不松开</text>
  </g>

  <line x1="318" y1="124" x2="420" y2="124" stroke="#4DDBBD" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- Step 2: press Tab repeatedly -->
  <g transform="translate(600 0)">
    <rect x="-112" y="56" width="180" height="120" rx="18" fill="#2A3540" fill-opacity="0.35"/>
    <rect x="-100" y="68" width="180" height="120" rx="18" fill="#04080C"/>
    <rect x="-100" y="60" width="180" height="120" rx="18" fill="url(#cap)" stroke="#3B4955" stroke-width="2"/>
    <text x="-78" y="98" class="hint">tab</text>
    <text x="-10" y="150" font-size="42" class="key" text-anchor="middle">⇥</text>
    <rect x="88" y="44" width="62" height="34" rx="17" fill="#4DDBBD"/>
    <text x="119" y="67" font-size="17" font-weight="800" fill="#0A2B33" text-anchor="middle">×N</text>
    <circle cx="-118" cy="232" r="14" fill="#4DDBBD"/>
    <text x="-118" y="237" class="num" text-anchor="middle">2</text>
    <text x="-94" y="240" class="step">按 Tab 选择</text>
    <text x="0" y="276" class="desc" text-anchor="middle">继续按 Tab 向后选择</text>
    <text x="0" y="300" class="desc" text-anchor="middle">加 Shift 反向 · 方向键也可以</text>
  </g>

  <line x1="780" y1="124" x2="882" y2="124" stroke="#4DDBBD" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- Step 3: release Option, window comes forward -->
  <g transform="translate(1000 0)">
    <rect x="-96" y="60" width="150" height="100" rx="12" fill="#3D8A8C" fill-opacity="0.55"/>
    <rect x="-70" y="82" width="150" height="100" rx="12" fill="#161B22" stroke="#4DDBBD" stroke-width="2"/>
    <rect x="-70" y="82" width="150" height="24" rx="12" fill="#22303A"/>
    <rect x="-70" y="94" width="150" height="12" fill="#22303A"/>
    <circle cx="-54" cy="94" r="4.5" fill="#FF5F57"/>
    <circle cx="-40" cy="94" r="4.5" fill="#FEBC2E"/>
    <circle cx="-26" cy="94" r="4.5" fill="#28C840"/>
    <rect x="-54" y="122" width="84" height="8" rx="4" fill="#E6EDF3"/>
    <rect x="-54" y="140" width="112" height="6" rx="3" fill="#5B6773"/>
    <rect x="-54" y="154" width="70" height="6" rx="3" fill="#5B6773"/>
    <path d="M50 150 L60 172 L64 162 L74 160 Z" fill="#FFFFFF" stroke="#0A2B33" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="-118" cy="232" r="14" fill="#4DDBBD"/>
    <text x="-118" y="237" class="num" text-anchor="middle">3</text>
    <text x="-94" y="240" class="step">松开 Option</text>
    <text x="0" y="276" class="desc" text-anchor="middle">跳转到选中的窗口</text>
  </g>
</svg>
