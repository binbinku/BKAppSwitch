<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="BKAppSwitch — 按住 ⌥ 按下 Tab，窗口随手切换">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132834"/>
      <stop offset="1" stop-color="#070F17"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4DDBBD" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4DDBBD" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="icon" x1="0.25" y1="0.07" x2="0.75" y2="0.93">
      <stop offset="0" stop-color="#1A3340"/>
      <stop offset="1" stop-color="#09141F"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Segoe UI", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  </style>

  <rect width="1280" height="400" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="28" fill="url(#dots)"/>
  <circle cx="1030" cy="200" r="300" fill="url(#glow)"/>

  <!-- App icon -->
  <g transform="translate(64 86) scale(0.225)">
    <rect x="66" y="66" width="892" height="892" rx="202" fill="url(#icon)" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="5"/>
    <rect x="260" y="324" width="490" height="330" rx="45" fill="#3D8A8C"/>
    <rect x="205" y="404" width="490" height="330" rx="45" fill="#4DDBBD"/>
    <path d="M337 569H553M483 499L553 569L483 639" fill="none" stroke="#0A2B33" stroke-width="29" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="316" y="172" font-size="70" font-weight="800" fill="#FFFFFF" letter-spacing="-1">BKAppSwitch</text>
  <text x="318" y="222" font-size="28" font-weight="600" fill="#4DDBBD">按住 ⌥ 按下 Tab，窗口随手切换</text>
  <text x="318" y="268" font-size="21" fill="#9FB4BD">macOS 菜单栏窗口切换器</text>
  <text x="318" y="302" font-size="21" fill="#9FB4BD">开源 · 原生 Swift · 零依赖 · MIT</text>

  <!-- Switcher panel mock -->
  <g transform="translate(860 52)">
    <rect x="0" y="6" width="340" height="296" rx="22" fill="#000000" fill-opacity="0.35"/>
    <rect x="0" y="0" width="340" height="296" rx="22" fill="#161B22" stroke="#2C3540"/>
    <rect x="22" y="22" width="18" height="16" rx="4" fill="#4DDBBD"/>
    <rect x="25" y="18" width="12" height="3" rx="1.5" fill="#4DDBBD" fill-opacity="0.6"/>
    <rect x="52" y="22" width="88" height="10" rx="5" fill="#E6EDF3"/>
    <rect x="52" y="38" width="60" height="6" rx="3" fill="#6E7B87"/>
    <circle cx="314" cy="32" r="10" fill="#3A434D"/>
    <line x1="20" y1="60" x2="320" y2="60" stroke="#2C3540"/>

    <!-- row 1 -->
    <g transform="translate(14 70)">
      <rect x="10" y="9" width="34" height="34" rx="9" fill="#FFFFFF"/>
      <path d="M33 16 L22 26 L33 36 Z" fill="#2F80ED"/>
      <rect x="58" y="14" width="110" height="9" rx="4.5" fill="#E6EDF3"/>
      <rect x="58" y="30" width="170" height="6" rx="3" fill="#5B6773"/>
      <text x="294" y="31" font-size="12" fill="#56616C" text-anchor="end" font-family="Menlo, monospace">01</text>
    </g>
    <!-- row 2: selected -->
    <g transform="translate(14 124)">
      <rect x="0" y="0" width="312" height="52" rx="12" fill="#1C2E31" stroke="#4DDBBD" stroke-opacity="0.55"/>
      <rect x="10" y="9" width="34" height="34" rx="9" fill="#FFFFFF"/>
      <path d="M33 16 L22 26 L33 36 Z" fill="#2F80ED"/>
      <rect x="58" y="14" width="92" height="9" rx="4.5" fill="#FFFFFF"/>
      <rect x="58" y="30" width="200" height="6" rx="3" fill="#6E8A8C"/>
      <path d="M296 20 V28 H282 M287 23 L282 28 L287 33" fill="none" stroke="#4DDBBD" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- row 3 -->
    <g transform="translate(14 178)">
      <rect x="10" y="9" width="34" height="34" rx="9" fill="#F2F5F8"/>
      <circle cx="27" cy="26" r="12" fill="#1E9BF0"/>
      <path d="M31 20 L25 28 L23 32 L29 24 Z" fill="#FF3B30"/>
      <rect x="58" y="14" width="124" height="9" rx="4.5" fill="#E6EDF3"/>
      <rect x="58" y="30" width="54" height="6" rx="3" fill="#5B6773"/>
      <text x="294" y="31" font-size="12" fill="#56616C" text-anchor="end" font-family="Menlo, monospace">03</text>
    </g>
    <!-- row 4 -->
    <g transform="translate(14 232)">
      <rect x="10" y="9" width="34" height="34" rx="9" fill="#1A1D21" stroke="#4A525B"/>
      <path d="M18 21 L23 25 L18 29 M25 31 H31" fill="none" stroke="#E6EDF3" stroke-width="2" stroke-linecap="round"/>
      <rect x="58" y="14" width="100" height="9" rx="4.5" fill="#E6EDF3"/>
      <rect x="166" y="11" width="44" height="15" rx="5" fill="#2A323B"/>
      <rect x="58" y="30" width="64" height="6" rx="3" fill="#5B6773"/>
      <text x="294" y="31" font-size="12" fill="#56616C" text-anchor="end" font-family="Menlo, monospace">04</text>
    </g>
  </g>
</svg>
